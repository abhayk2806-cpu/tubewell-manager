# Netlify build and hosting for the Tubewell Hisab single-page app (Phase 10A).
# No secrets here: VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY are set in the
# Netlify UI (see docs/DEPLOYMENT.md). Never put a service-role / secret key anywhere.

[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  # Node 24 = the current LTS line; the project builds and tests on 24.14.0.
  NODE_VERSION = "24"
  # The pnpm version that wrote pnpm-lock.yaml (lockfile v9).
  PNPM_VERSION = "11.1.3"

# Single-page app: every route (/farmers/abc, /months?month=2026-10, ...) loads index.html.
# Real files such as /assets/*.js and /favicon.svg are served first (no force).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Safe response headers on every path.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"

# Hashed build files never change: cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The entry page always revalidates, so a new deploy's chunk names are picked up.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
